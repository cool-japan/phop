# PyPI publish workflow for the `phop` Python extension module (crate `phop-py`).
#
# Modeled on `maturin generate-ci github`, but targeting the sub-crate manifest
# `crates/phop-py/Cargo.toml` (the workspace root is not the package that ships).
#
# NOTE ON WHEEL COUNT — pyo3 0.29 is configured here WITHOUT abi3, so the produced
# wheels are Python-version-specific (one wheel per interpreter per platform). We keep
# this file simple by relying on maturin-action's default per-runner interpreter
# handling. To collapse every platform down to a SINGLE portable abi3 wheel, enable the
# pyo3 `abi3-py39` feature in crates/phop-py/Cargo.toml, e.g.:
#     pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
# Do NOT change the crate from this workflow — that is a deliberate manifest decision.

name: PyPI publish (phop-py)

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path crates/phop-py/Cargo.toml
          sccache: "true"
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path crates/phop-py/Cargo.toml
          sccache: "true"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path crates/phop-py/Cargo.toml
          sccache: "true"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/phop-py/Cargo.toml
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # ---------------------------------------------------------------------------
  # Publish to PyPI using Trusted Publishing (OIDC) — no API token stored in the
  # repo. The `id-token: write` permission lets pypa/gh-action-pypi-publish mint a
  # short-lived OIDC credential that PyPI exchanges for an upload token.
  #
  # ONE-TIME MAINTAINER SETUP (PyPI "pending publisher", do once before first run):
  #   PyPI -> Account -> Publishing -> "Add a new pending publisher", set:
  #     PyPI Project Name : phop
  #     Owner             : cool-japan
  #     Repository name   : phop
  #     Workflow name     : pypi-publish.yml
  #     Environment name  : (leave blank — no GitHub Environment is used here)
  #   See: https://docs.pypi.org/trusted-publishers/adding-a-publisher/
  # ---------------------------------------------------------------------------
  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist]
    # Publish on a real GitHub Release; workflow_dispatch runs build/test only.
    if: ${{ github.event_name == 'release' }}
    permissions:
      id-token: write       # REQUIRED for Trusted Publishing (OIDC)
      contents: read
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` — OIDC is used. `packages-dir` defaults to dist/.

      # -----------------------------------------------------------------------
      # FALLBACK: API-token auth (use ONLY if you cannot configure Trusted
      # Publishing). Delete the OIDC step above, drop the `id-token: write`
      # permission, then add the `PYPI_API_TOKEN` repo secret and uncomment:
      #
      # - name: Publish to PyPI (API token)
      #   uses: pypa/gh-action-pypi-publish@release/v1
      #   with:
      #     password: ${{ secrets.PYPI_API_TOKEN }}
      #
      # Alternatively, publish straight from maturin-action with a token:
      # - name: Publish to PyPI (maturin upload)
      #   uses: PyO3/maturin-action@v1
      #   env:
      #     MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      #   with:
      #     command: upload
      #     args: --non-interactive --skip-existing dist/*
      # -----------------------------------------------------------------------
